[project]
name = "vision-from-scratch"
version = "0.1.0"
description = "以 Pascal VOC 練習物件偵測與語意分割（PyTorch + timm + torchvision）"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
